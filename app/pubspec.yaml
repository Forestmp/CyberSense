name: cybersense
description: "CyberSense: aprende a identificar riesgos digitales antes de que sea demasiado tarde."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-cybersense.png
    - assets/logo-escudo.png
